# =============================================================================
# テーマ設計案 v2
# =============================================================================
#
# 目的: UIの色体系を整理し、一貫性のあるデザインを実現する
#
# 設計方針:
#   0. palette: ユーザが自由に定義できる色（他のセクションから参照可能）
#   1. 基本4層（Layer A-D）
#   2. 各層の状態色（hover, selected, selected_alt, focused, focused_alt）
#   3. テキスト色を [text] セクションに集約
#   4. ボーダー/区切り線（背景からの距離で分類）
#   5. コンポーネント固有色（層を文字列参照、パース時に解決）
#
# 状態の優先順位: hover > focused > selected
#   例: selected + hover → hover色を適用
#
# 参照の仕組み:
#   - "palette.blue_500" → palette セクションの blue_500 を参照
#   - "layers.content" → layers セクションの content を参照
#   - "#FF0000" → 直接色指定
#   - "transparent" → 透明
#
# =============================================================================

# =============================================================================
# 0. Palette（ユーザー定義色）
# =============================================================================
# ここに定義した色は、他のすべてのセクションから参照可能
# 例: "palette.gray_900" のように参照する
#
# 用途:
#   - グレースケールの定義
#   - ブランドカラーの定義
#   - 他の色から参照される基本色
#   - palette 内での相互参照も可能

[palette]
# グレースケール（暗→明）
gray_1000 = "#000000"
gray_975 = "#070707"
gray_950 = "#0A0A0A"
gray_925 = "#0F0F0F"
gray_900 = "#121212"
gray_875 = "#151515"
gray_850 = "#181818"
gray_825 = "#1A1A1A"
gray_800 = "#1E1E1E"
gray_750 = "#202020"
gray_700 = "#242424"
gray_600 = "#262626"
gray_500 = "#404040"
gray_400 = "#525252"
gray_300 = "#737373"
gray_200 = "#A3A3A3"
gray_100 = "#E5E5E5"
gray_50 = "#F5F5F5"

# ブルー系（アクセント）
blue_900 = "#0A1F3A"
blue_800 = "#10325C"
blue_700 = "#1A4570"
blue_600 = "#2A5580"
blue_500 = "#4E6F8F"
blue_400 = "#5A7FA5"
blue_300 = "#7A9FBF"
blue_200 = "#A0BFD9"

# ステータス色
red_500 = "#FB7185"
amber_500 = "#FBBF24"
emerald_500 = "#34D399"
sky_500 = "#60A5FA"

# 影の色（RGBA形式）
shadow_soft = "#00000033"       # 20% 黒
shadow_medium = "#00000066"     # 40% 黒
shadow_strong = "#00000099"     # 60% 黒

# palette 内での相互参照例
# main_accent = "blue_500"    # palette.blue_500 と同じ色になる
# soft_accent = "blue_800"    # palette.blue_800 を参照

# =============================================================================
# 1. 基本4層
# =============================================================================

[layers]
# A: タイトルバー、非アクティブなワークスペースタブ
chrome = "palette.gray_925"

# B: Pane背景（縦タブ背景）、アクティブなワークスペースタブ
nav = "palette.gray_900"

# C: コンテンツ領域のベース色、アクティブな縦タブ
content = "palette.gray_850"

# D: コンテンツ領域の交互色（縞模様）
content_alt = "palette.gray_800"

# =============================================================================
# 2. 状態色
# =============================================================================
# 各状態は bg / border / shadow のセットで定義する
# - bg: 背景色
# - border: ボーダー色（"transparent" で非表示）
# - shadow: 影の色のみ（"none" で影なし。位置・ぼかし半径はUI実装側で決定）
#
# 省略時のデフォルト:
#   - border: "transparent"
#   - shadow: "none"
#

# -----------------------------------------------------------------------------
# Layer A (chrome) の状態
# -----------------------------------------------------------------------------
[layers.chrome_states.hover]
bg = "palette.gray_875"
border = "transparent"              # ボーダー（省略可、省略時は "transparent"）
shadow = "none"                     # 影の色（省略可、省略時は "none"。位置・ぼかしはUI側で決定）

# active は使わない（activeはnav色になるため）

# -----------------------------------------------------------------------------
# Layer B (nav) の状態
# -----------------------------------------------------------------------------
[layers.nav_states.hover]
bg = "palette.gray_825"
border = "transparent"
shadow = "none"

# active は使わない（activeはcontent色になるため）

# -----------------------------------------------------------------------------
# Layer C (content) の状態
# -----------------------------------------------------------------------------
[layers.content_states.hover]
bg = "palette.gray_750"
border = "transparent"
shadow = "none"

[layers.content_states.selected]
bg = "palette.blue_800"
border = "palette.blue_500"         # 選択時はボーダーで強調
shadow = "none"

[layers.content_states.focused]
bg = "palette.blue_700"
border = "palette.blue_400"         # フォーカス時はさらに明るいボーダー
shadow = "palette.shadow_soft"      # 影の色のみ指定（位置・ぼかしはUI側で決定）

# -----------------------------------------------------------------------------
# Layer D (content_alt) の状態
# -----------------------------------------------------------------------------
[layers.content_alt_states.hover]
bg = "palette.gray_700"
border = "transparent"
shadow = "none"

[layers.content_alt_states.selected]
bg = "palette.blue_800"
border = "palette.blue_500"
shadow = "none"

[layers.content_alt_states.focused]
bg = "palette.blue_700"
border = "palette.blue_400"
shadow = "palette.shadow_soft"

# 注: selected / focused が指定されていない場合、
#     content_states の値にフォールバックする

# =============================================================================
# 3. テキスト色
# =============================================================================

[text]
# 基本テキスト色
primary = "palette.gray_50"         # メインテキスト
secondary = "palette.gray_100"      # 副次的テキスト
muted = "palette.gray_200"          # 控えめテキスト
subtle = "palette.gray_300"         # さらに控えめ
disabled = "palette.gray_400"       # 無効状態

# アクセント
accent = "palette.blue_500"         # アクセントテキスト（リンク等）
on_accent = "palette.gray_50"       # アクセント背景上のテキスト

# 状態別
on_selected = "palette.gray_50"     # 選択時のテキスト
on_focused = "palette.gray_50"      # フォーカス時のテキスト

# =============================================================================
# 4. ボーダー/区切り線
# =============================================================================
# 背景からの視覚的距離で分類:
#   - subtle: 背景に最も近い（ほぼ見えない）
#   - default: 通常の境界線
#   - strong: 明確な区切り

[borders]
# 控えめな区切り（背景に近い）
subtle = "palette.gray_825"

# 通常のボーダー
default = "palette.gray_600"

# 強調されたボーダー
strong = "palette.gray_500"

# Pane分割時のハンドル
split_handle = "palette.gray_500"
split_handle_hover = "palette.gray_400"

# =============================================================================
# 5. アクセント色
# =============================================================================

[accent]
# プライマリアクセント
primary = "palette.blue_500"
primary_hover = "palette.blue_400"
primary_soft = "palette.blue_800"    # 背景用（選択時など）

# フォーカスリング
focus_ring = "palette.blue_600"

# ステータス色
error = "palette.red_500"
error_soft = "#7F1D1D"               # エラー背景用（palette にない場合は直接指定）
warning = "palette.amber_500"
warning_soft = "#78350F"             # 警告背景用
success = "palette.emerald_500"
success_soft = "#064E3B"             # 成功背景用
info = "palette.sky_500"
info_soft = "#1E3A5F"                # 情報背景用

# スクロールバー
scrollbar_track = "transparent"
scrollbar_thumb = "palette.gray_400"
scrollbar_thumb_hover = "palette.gray_300"
scrollbar_thumb_active = "palette.gray_200"

# =============================================================================
# 6. コンポーネント固有色（オプション）
# =============================================================================
# 文字列参照（"layers.content" 等）はパース時に解決される
# 直接色指定（"#RRGGBB"）も可能

[components.address_bar]
bg = "layers.content"           # C層を参照
text = "text.primary"
border = "borders.subtle"

[components.rows_header]
bg = "layers.nav"               # B層を参照
text = "text.primary"
border = "borders.subtle"
hover_bg = "layers.nav_states.hover"

[components.workspace_tabs]
# タイトルバー内のタブ
bg_inactive = "layers.chrome"
bg_active = "layers.nav"
bg_hover = "layers.chrome_states.hover"
text_inactive = "text.muted"
text_active = "text.primary"
border = "borders.subtle"

[components.vertical_tabs]
# 縦タブ
bg_inactive = "layers.nav"
bg_active = "layers.content"
bg_hover = "layers.nav_states.hover"
text_inactive = "text.muted"
text_active = "text.primary"
separator = "borders.subtle"

# =============================================================================
# 実装メモ
# =============================================================================

# パース処理:
#   1. すべてのセクションを読み込み
#   2. 文字列参照（"layers.xxx"等）を実際の色に解決
#   3. フォールバック処理（selected_alt → selected）
#
# 状態解決の優先順位（UI要素が複数状態を持つ場合）:
#   hover > focused > selected > base
#
# 例: ファイル行が selected かつ hover の場合
#   → hover 色を適用（UX観点から、ユーザーの操作に即座に反応）
