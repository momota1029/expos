[package]
name = "thumb-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Extensible thumbnail generation engine with pluggable providers"

[lib]
name = "thumb_engine"
path = "src/lib.rs"

[features]
default = ["image", "ffmpeg", "psd", "clip", "kra", "mdp"]
image = ["dep:image"]
ffmpeg = []
psd = ["dep:psd", "dep:ag-psd"]
clip = ["dep:rusqlite"]
kra = ["dep:zip"]
mdp = ["dep:flate2"]

[dependencies]
thiserror = "2"
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
    "tiff",
    "ico",
] }
psd = { version = "0.3", optional = true }
ag-psd = { version = "0.3", optional = true }
rusqlite = { version = "0.32", optional = true, features = ["bundled", "serialize"] }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
flate2 = { version = "1", optional = true }
